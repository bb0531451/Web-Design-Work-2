
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prophet Card</title>
    <link rel="stylesheet" href="prophet.css">
</head>
<body>
    <main class="home-grid">
        <div id="hero">
            <section id="hero-msg">
                <h1 class="home-title">Dallin H. Oaks</h1>
                <h4>
                    18th President of the Church of Jesus
                    Christ of Latter-day Saints
                </h4>
            </section>

            <div id="hero-box">
                <img
                    id="hero-img"
                    src="dallin_oaks.jpg"
                    alt="Portrait of Dallin H. Oaks"
                >
            </div>

            <ul class="prophet-list">
                <li>Born: Aug 12, 1932</li>
                <li>Apostle: Apr 7, 1984</li>
                <li>Prophet: Oct 14, 2025</li>
            </ul>

            <p class="quote">
                "The gospel of Jesus Christ teaches us
                that our highest priority is to love God
                and to love our fellowmen."
            </p>
        </div>
    </main>
</body>
</html>
